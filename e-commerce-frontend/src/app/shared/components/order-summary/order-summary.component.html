<aside class="order-summary">
  <h2>Order summary</h2>

  <div class="summary-items">
    <div class="summary-item" *ngFor="let item of items">
      <span class="summary-item-name">{{ item.product_name }} &times; {{ item.quantity }}</span>
      <span class="summary-item-total">{{ item.line_total | currency }}</span>
    </div>
  </div>

  <div class="summary-row">
    <span>Subtotal</span>
    <span>{{ subtotal | currency }}</span>
  </div>
  <div class="summary-row">
    <span>Tax</span>
    <span>{{ taxAmount | currency }}</span>
  </div>
  <div class="summary-row">
    <span>Shipping</span>
    <span>{{ shippingAmount | currency }}</span>
  </div>

  <div class="summary-row summary-total">
    <span>Total</span>
    <span>{{ totalAmount | currency }}</span>
  </div>

  <button
    type="button"
    class="btn btn-primary summary-continue-btn"
    [disabled]="continueDisabled || isSubmitting"
    (click)="continueClicked.emit()"
  >
    <span class="spinner" *ngIf="isSubmitting"></span>
    {{ continueLabel }}
  </button>

  <button
    type="button"
    class="btn btn-secondary summary-back-btn"
    *ngIf="showBack"
    (click)="backClicked.emit()"
  >
    {{ backLabel }}
  </button>
</aside>
