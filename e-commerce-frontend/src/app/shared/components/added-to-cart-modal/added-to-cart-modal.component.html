<div class="modal-backdrop" *ngIf="cartService.lastAddedItem() as item" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <button type="button" class="modal-close" (click)="close()" aria-label="Close">&times;</button>

    <div class="modal-heading">
      <span class="check-icon">✓</span>
      <span>Added to cart</span>
    </div>

    <div class="modal-body">
      <img
        *ngIf="item.product_image_url; else noImage"
        [src]="item.product_image_url"
        [alt]="item.product_name"
        class="modal-product-image"
      />
      <ng-template #noImage><div class="modal-product-image modal-product-image-placeholder">No image</div></ng-template>

      <div class="modal-product-info">
        <div class="modal-product-name">{{ item.product_name }}</div>
        <div class="modal-product-price">{{ item.price | currency }}</div>
        <div class="modal-product-qty">Now in cart: {{ item.quantity_in_cart }}</div>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="close()">Continue shopping</button>
      <a routerLink="/cart" class="btn btn-primary" (click)="close()">View cart</a>
    </div>

  </div>
</div>
