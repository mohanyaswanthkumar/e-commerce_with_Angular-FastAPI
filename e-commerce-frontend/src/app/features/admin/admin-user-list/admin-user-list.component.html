<div class="admin-page">

  <div class="page-header">
    <h1>Users</h1>
  </div>

  <p class="loading-text" *ngIf="isLoading()">Loading users...</p>

  <table class="admin-table" *ngIf="!isLoading()">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Role</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users()">
        <td>{{ user.first_name }} {{ user.last_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.mobile_number }}</td>
        <td class="capitalize">{{ user.role }}</td>
        <td>
          <span class="pill" [class.pill-success]="user.is_active" [class.pill-muted]="!user.is_active">
            {{ user.is_active ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td class="row-actions">
          <a [routerLink]="['/admin/users', user.id, 'edit']" class="btn btn-secondary">Edit</a>
          <button
            type="button"
            class="btn btn-danger"
            [disabled]="!user.is_active || deactivatingId() === user.id"
            (click)="deactivateUser(user)"
          >
            {{ deactivatingId() === user.id ? 'Deactivating...' : 'Deactivate' }}
          </button>
        </td>
      </tr>
      <tr *ngIf="users().length === 0">
        <td colspan="6" class="empty-cell">No users found.</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" *ngIf="!isLoading() && totalPages > 1">
    <button type="button" class="btn btn-secondary" [disabled]="page() <= 1" (click)="goToPage(page() - 1)">Previous</button>
    <span class="page-indicator">Page {{ page() }} of {{ totalPages }}</span>
    <button type="button" class="btn btn-secondary" [disabled]="page() >= totalPages" (click)="goToPage(page() + 1)">Next</button>
  </div>

</div>
