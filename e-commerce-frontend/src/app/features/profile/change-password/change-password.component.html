<div class="profile-page container">

  <h1>Change password</h1>

  <div class="alert alert-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form class="profile-card" [formGroup]="form" (ngSubmit)="save()" novalidate>

    <div class="form-field">
      <label for="current_password">Current password</label>
      <input id="current_password" type="password" formControlName="current_password" autocomplete="current-password" />
      <span class="field-error" *ngIf="form.get('current_password')?.touched && form.get('current_password')?.hasError('required')">
        Current password is required.
      </span>
    </div>

    <div class="form-field">
      <label for="new_password">New password</label>
      <input id="new_password" type="password" formControlName="new_password" autocomplete="new-password" />
      <span class="field-error" *ngIf="form.get('new_password')?.touched && form.get('new_password')?.hasError('minlength')">
        Password must be at least 8 characters.
      </span>
    </div>

    <div class="form-field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" type="password" formControlName="confirm_password" autocomplete="new-password" />
      <span class="field-error" *ngIf="form.get('confirm_password')?.touched && passwordsMismatch">
        Passwords do not match.
      </span>
    </div>

    <div class="profile-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="isSaving()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
        <span class="spinner" *ngIf="isSaving()"></span>
        {{ isSaving() ? 'Saving...' : 'Save' }}
      </button>
    </div>

  </form>
</div>
